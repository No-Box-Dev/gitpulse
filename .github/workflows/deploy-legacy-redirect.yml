name: Deploy Legacy Host Redirect

on:
  push:
    branches: [main]
    paths:
      - legacy-redirect/**
      - .github/workflows/deploy-legacy-redirect.yml
  workflow_dispatch:

concurrency:
  group: deploy-legacy-redirect
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - name: Deploy the retired Unticket host redirect
        working-directory: legacy-redirect
        run: npx --yes wrangler@4.129.1 pages deploy . --project-name unticket --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
