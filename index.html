<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NoxConnect brings GitHub activity, planning, feedback, and alerts together for your team." />
    <title>NoxConnect</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        function loadNoxSpot() {
        if (window.location.pathname.startsWith('/share/')) return;
        var s = document.createElement('script');
        s.src = 'https://cdn.noxspot.dev/noxspot.min.js';
        s.async = true;
        s.onload = function () {
          if (window.NoxSpot) {
            window.NoxSpot.init({ siteId: '43139df3-30bb-4208-bee8-1cffb6939b9b' });
          }
        };
        document.head.appendChild(s);
        }
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(loadNoxSpot, { timeout: 2000 });
        } else {
          window.setTimeout(loadNoxSpot, 1000);
        }
      })();
    </script>
  </body>
</html>
