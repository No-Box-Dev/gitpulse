name: Deploy Nox Site

on:
  push:
    branches: [main]
    paths:
      - nox-site/**
      - .github/workflows/deploy-nox-site.yml
  workflow_dispatch:

concurrency:
  group: deploy-nox-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - name: Deploy the static Nox landing site
        working-directory: nox-site
        run: npx --yes wrangler@4.129.1 pages deploy . --project-name nox --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
