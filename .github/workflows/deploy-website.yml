name: Deploy Website

# feed.noxhere.com publishes from this repo's `website/` on every push to main.
# Mirror of NoxKey's deploy-website workflow.
#
# One-time provisioning (do this before the first push):
#   1. In Cloudflare Dashboard → Workers & Pages → Create → Pages →
#      Direct Upload. Name it `unticket-website`.
#   2. Once created, add the custom domain `feed.noxhere.com` (Cloudflare handles
#      the cert if the zone is in your account).
#   3. Add these repo secrets in GitHub:
#        CLOUDFLARE_API_TOKEN   (Account → API Tokens → Edit Cloudflare
#                                Workers, scoped to this Pages project)
#        CLOUDFLARE_ACCOUNT_ID  (visible in the Pages URL)
#   4. First deploy fires on the next merge that touches website/**,
#      or manually via `workflow_dispatch`.
on:
  push:
    branches: [main]
    paths: [website/**]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Cloudflare Pages
        working-directory: website
        run: npx --yes wrangler@4.127.1 pages deploy . --project-name unticket-website --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
